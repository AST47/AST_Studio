<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Studio Gradient: Indigo -> Purple -> Pink -->
    <linearGradient id="badgeBorderGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6366f1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Gradient Border -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#badgeBorderGradient)" filter="url(#badgeShadow)" />

  <!-- Inner Dark Box -->
  <rect x="14" y="14" width="92" height="92" rx="24" fill="#0a0a0a" />

  <!-- AudioWaveform Icon (Indigo 400: #818cf8) -->
  <g transform="translate(36, 36) scale(2)" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M2 13a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0v-4a2 2 0 0 1 2-2" />
  </g>
</svg>
